
name: Build PS4 Video Web Server

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile PS4 Video Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            binutils \
            make \
            xxd \
            git

      - name: Clone PS4 Payload SDK
        run: |
          git clone --depth 1 \
            https://github.com/Scene-Collective/ps4-payload-sdk.git \
            "$RUNNER_TEMP/ps4-payload-sdk"

      - name: Build PS4 SDK
        run: |
          set -e

          export PS4SDK="$RUNNER_TEMP/ps4-payload-sdk"

          echo "Building PS4 Payload SDK..."
          make -C "$PS4SDK/libPS4" -j2

          echo "SDK build completed."

          test -f "$PS4SDK/libPS4/include"
          test -f "$PS4SDK/libPS4/linker.x"
          test -f "$PS4SDK/libPS4/crt0.s"

      - name: Prepare project
        run: |
          set -e

          mkdir -p assets build

          echo "Generating embedded web assets..."

          xxd -i index.html > assets/index.h
          xxd -i loader.html > assets/loader.h

      - name: Compile payload
        run: |
          set -e

          export PS4SDK="$RUNNER_TEMP/ps4-payload-sdk"

          echo "=================================="
          echo " PS4 VIDEO WEBSERVER BUILD"
          echo "=================================="

          make clean
          make -j2

          echo "=================================="
          echo " BUILD COMPLETE"
          echo "=================================="

          ls -lh *.bin

      - name: Verify output
        run: |
          set -e

          BIN=$(find . -maxdepth 1 -type f -name '*.bin' | head -n 1)

          if [ -z "$BIN" ]; then
            echo "ERROR: Payload binary not found!"
            exit 1
          fi

          if [ ! -s "$BIN" ]; then
            echo "ERROR: Payload binary is empty!"
            exit 1
          fi

          echo "Payload: $BIN"
          echo "Size: $(stat -c%s "$BIN") bytes"

          file "$BIN"

      - name: Upload PS4 payload
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Websrv-Video
          path: |
            *.bin
            *.map
          if-no-files-found: error
          retention-days: 30
