<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Payload File Sender</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #0e0e10;
            color: #efeff1;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: #18181b;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            margin: auto;
            border: 1px solid #303032;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #333;
            background: #09090b;
            color: #fff;
            box-sizing: border-box;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .buttons a {
            text-decoration: none;
        }

        button,
        a {
            width: 100%;
            padding: 15px;
            border-radius: 6px;
            border: none;
            background: #9147ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        button:active {
            background: #772ce8;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background: #000;
            color: #adff2f;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-align: left;
            min-height: 100px;
            border: 1px solid #222;
        }

        .label {
            display: block;
            text-align: left;
            font-size: 14px;
            color: #adadb8;
            margin-bottom: -10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h3>Payload Sender</h3>

        <span class="label">PS4 IP Address:</span>
        <input type="text" id="ps4ip" placeholder="e.g. 192.168.1.15" value="">

        <span class="label">PS4 Port:</span>
        <input type="text" id="ps4port" placeholder="e.g. 9090" value="">

        <span class="label">Select Payload (.bin):</span>
        <input type="file" id="fileInput" accept=".bin">

        <div class="buttons">
            <button onclick="uploadAndSend()">Send to PS4</button>
            <a href="index.html">Back</a>
        </div>

        <div id="status">Status: Ready to upload...</div>
    </div>

    <script>
        window.onload = function () {
            document.getElementById('ps4ip').value = window.location.hostname;
        }
        function log(msg) {
            const statusBox = document.getElementById('status');
            statusBox.innerHTML += "> " + msg + "<br>";
            statusBox.scrollTop = statusBox.scrollHeight;
        }

        async function uploadAndSend() {
            const ip = document.getElementById('ps4ip').value || window.location.hostname;
            const port = document.getElementById('ps4port').value || "9090";
            log("Target: " + ip + ":" + port);

            const fileElement = document.getElementById('fileInput');
            const file = fileElement.files[0];

            if (!ip || !file) {
                alert("Please enter IP and select file.");
                return;
            }

            log("Step 1: Requesting Browser Permission...");

            try {
                await fetch(`http://${ip}:${port}/status`, { mode: 'no-cors' });
            } catch (e) {
                log("Permission hint sent (Ignoring error)...");
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const rawData = e.target.result;
                log("Step 2: Sending Payload...");

                const xhr = new XMLHttpRequest();
                xhr.open("POST", `http://${ip}:${port}`, true);
                xhr.send(rawData);
                log("Sent! Check PS4 notification.");
            };
            reader.readAsArrayBuffer(file);
        }

        function checkConnection() {
            const ip = document.getElementById('ps4ip').value;
            const port = document.getElementById('ps4port').value || "9090";
            const img = new Image();
            img.src = `http://${ip}:${port}/favicon.ico?${Date.now()}`;

            log("Testing connection...");

            img.onerror = function () {
                log("Ping attempted. (Mixed content still restricts results)");
            };
        }
    </script>

</body>

</html>
